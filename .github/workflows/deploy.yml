name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (SPA mode, /web/ base)
        env:
          # Serve the app from https://zhaoz-glitch.github.io/web/
          GITHUB_PAGES: "true"
          # Point the frontend at the deployed Flask backend
          VITE_API_BASE: https://low-carbon-backend-production.up.railway.app
        run: npm run build

      # SPA fallback: deep links like /web/login hit 404.html which
      # GitHub Pages serves instead of a hard error page.
      - name: Add SPA 404 fallback
        run: cp build/client/index.html build/client/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
